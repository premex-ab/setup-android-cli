name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: validate action
    runs-on: [self-hosted, macOS, ARM64, tart]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Test action scripts
        run: |
          python -m pip install PyYAML==6.0.2
          python -m unittest discover -s tests -v
      - name: actionlint
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- latest "$RUNNER_TEMP/actionlint"
          "$RUNNER_TEMP/actionlint/actionlint"

  selftest:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: test-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: [self-hosted, macOS, ARM64, tart]
          - platform: linux-x64
            runner: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Run action
        id: cli
        uses: ./
        with:
          packages: platform-tools

      - name: Assert CLI is installed and on PATH
        run: |
          set -euo pipefail
          command -v android
          android --version

      - name: Assert outputs are populated
        env:
          CLI_VERSION: ${{ steps.cli.outputs.cli-version }}
          SDK_PATH: ${{ steps.cli.outputs.sdk-path }}
        run: |
          set -euo pipefail
          [ -n "$CLI_VERSION" ]
          [ -d "$SDK_PATH" ]

      - name: Assert platform-tools installed
        run: |
          set -euo pipefail
          [ -x "$ANDROID_HOME/platform-tools/adb" ]
          adb --version

  selftest-multipackage:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: test-multipackage
    runs-on: [self-hosted, macOS, ARM64, tart]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21' }
      - uses: ./
        with:
          packages: |
            platforms/android-34
            build-tools/34.0.0
            platform-tools
      - name: Verify SDK packages
        run: |
          set -euo pipefail
          [ -d "$ANDROID_HOME/platforms/android-34" ]
          [ -d "$ANDROID_HOME/build-tools/34.0.0" ]
          [ -x "$ANDROID_HOME/platform-tools/adb" ]

  selftest-nopackages:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: test-cli-only
    runs-on: [self-hosted, macOS, ARM64, tart]
    steps:
      - uses: actions/checkout@v7
      - id: cli
        uses: ./
      - name: CLI installed, no SDK packages
        env:
          CLI_VERSION: ${{ steps.cli.outputs.cli-version }}
        run: |
          set -euo pipefail
          command -v android
          [ -n "$CLI_VERSION" ]

  selftest-nocache:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: test-nocache
    runs-on: [self-hosted, macOS, ARM64, tart]
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          cache: 'false'
          packages: platform-tools
      - run: adb --version

  selftest-custom-sdk-path:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: test-custom-sdk-path
    runs-on: [self-hosted, macOS, ARM64, tart]
    steps:
      - uses: actions/checkout@v7
      - id: cli
        uses: ./
        with:
          sdk-path: /tmp/my-android-sdk
          packages: platform-tools
      - name: Verify custom path
        env:
          SDK_PATH: ${{ steps.cli.outputs.sdk-path }}
        run: |
          set -euo pipefail
          [ "$ANDROID_HOME" = "$(cd /tmp/my-android-sdk && pwd -P)" ]
          [ -x "/tmp/my-android-sdk/platform-tools/adb" ]
          [ "$SDK_PATH" = "$ANDROID_HOME" ]

  selftest-windows:
    name: test-windows-x64
    # Only repository branches may execute code on our persistent runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install SDK at a path containing spaces
        id: cli
        uses: ./
        with:
          sdk-path: ${{ runner.temp }}/android sdk
          packages: |
            platforms/android-34
            build-tools/34.0.0
            platform-tools
      - name: Verify native Windows paths and tools
        shell: pwsh
        env:
          SDK_PATH: ${{ steps.cli.outputs.sdk-path }}
          CLI_VERSION: ${{ steps.cli.outputs.cli-version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:CLI_VERSION) { throw 'Missing CLI version' }
          if ($env:ANDROID_HOME -ne $env:SDK_PATH) { throw 'ANDROID_HOME mismatch' }
          if ($env:ANDROID_SDK_ROOT -ne $env:SDK_PATH) { throw 'ANDROID_SDK_ROOT mismatch' }
          foreach ($path in @('platforms/android-34/android.jar', 'build-tools/34.0.0/aapt2.exe', 'platform-tools/adb.exe')) {
            if (-not (Test-Path (Join-Path $env:SDK_PATH $path))) { throw "Missing $path" }
          }
          android --no-metrics --version
          if ($LASTEXITCODE -ne 0) { throw 'android failed' }
          adb --version
          if ($LASTEXITCODE -ne 0) { throw 'adb failed' }
      - name: Verify CLI-only setup without caching
        uses: ./
        with:
          cache: 'false'
      - name: Verify default SDK path
        shell: pwsh
        run: |
          $expected = [IO.Path]::GetFullPath((Join-Path $env:LOCALAPPDATA 'Android/Sdk'))
          if ([IO.Path]::GetFullPath($env:ANDROID_HOME) -ne $expected) { throw 'Unexpected default SDK path' }
          android --no-metrics --version
          if ($LASTEXITCODE -ne 0) { throw 'android failed' }

  # Gate job. Name MUST be "CI" to match the org-level required_status_checks
  # ruleset that protects the default branch.
  CI:
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs:
      - validate
      - selftest
      - selftest-multipackage
      - selftest-nopackages
      - selftest-nocache
      - selftest-custom-sdk-path
      - selftest-windows
    runs-on: [self-hosted, macOS, ARM64, tart]
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "::error::One or more required jobs failed or were cancelled."
              exit 1
            fi
          done
          echo "All checks passed."
