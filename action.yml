name: 'Setup Android CLI'
description: 'Install and cache Google''s Android CLI and explicitly selected SDK packages.'
author: 'Premex'

branding:
  icon: 'smartphone'
  color: 'green'

inputs:
  packages:
    description: >-
      SDK packages to install via `android sdk install`. Space- or
      newline-separated, slash syntax (e.g. `platforms/android-34
      build-tools/34.0.0 platform-tools`). Leave empty to install only the
      CLI with no SDK packages.
    required: false
    default: ''
  sdk-path:
    description: >-
      Override where the Android SDK is installed. Defaults to
      `~/Library/Android/sdk` on macOS, `~/Android/Sdk` on Linux, and
      `%LOCALAPPDATA%/Android/Sdk` on Windows. The
      chosen path is exported as `ANDROID_HOME` and `ANDROID_SDK_ROOT` for
      subsequent steps.
    required: false
    default: ''
  cache:
    description: >-
      Cache the CLI's unpacked resources (`~/.android/bin`) and the SDK
      between runs. Set to `false` to disable. Does not affect Gradle
      caching - use `gradle/actions/setup-gradle@v4` for that.
    required: false
    default: 'true'
  cache-key:
    description: >-
      Extra input appended to the cache key. Change to bust the cache. The
      default key already includes OS, arch, SDK path, packages, download URL, and the hash of
      `**/libs.versions.toml` / `**/build.gradle*`.
    required: false
    default: ''
  no-metrics:
    description: >-
      Pass `--no-metrics` on `android` invocations made by this action
      (opts out of Google's usage telemetry). Defaults to `true`.
    required: false
    default: 'true'
  install-url-base:
    description: >-
      Override the base URL for downloading the CLI binary. The action
      appends `/<platform>/android` (`android.exe` on Windows).
      Useful for internal mirrors or air-gapped environments. Defaults to
      Google's redirector.
    required: false
    default: 'https://redirector.gvt1.com/edgedl/android/cli/latest'

outputs:
  sdk-path:
    description: Absolute path to the Android SDK managed by this action.
    value: ${{ steps.summary.outputs.sdk-path }}
  cli-version:
    description: Version string returned by `android --version`.
    value: ${{ steps.summary.outputs.cli-version }}
  cache-hit:
    description: >-
      Whether the `~/.android/bin` + SDK cache was hit. Empty when caching
      is disabled.
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Resolve platform and paths
      id: platform
      shell: bash
      env:
        INPUT_SDK_PATH: ${{ inputs.sdk-path }}
        PACKAGES: ${{ inputs.packages }}
        INSTALL_URL_BASE: ${{ inputs.install-url-base }}
      run: |
        set -euo pipefail

        os=$(uname -s)
        arch=$(uname -m)
        case "$os/$arch" in
          Linux/x86_64)   slug=linux_x86_64 ;;
          Darwin/arm64)   slug=darwin_arm64 ;;
          Darwin/x86_64)
            echo "::warning::Intel Mac runner detected. Google only ships darwin_arm64; using that binary under Rosetta. Prefer an Apple Silicon runner for faster builds."
            slug=darwin_arm64
            ;;
          MINGW*/x86_64|MSYS*/x86_64) slug=windows_x86_64 ;;
          *)
            echo "::error::Unsupported platform: $os/$arch. Supported: Linux x86_64, macOS arm64, Windows x86_64."
            exit 1
            ;;
        esac

        if [[ -n "${INPUT_SDK_PATH}" ]]; then
          sdk_path="${INPUT_SDK_PATH}"
        elif [[ "$os" == "Darwin" ]]; then
          sdk_path="$HOME/Library/Android/sdk"
        elif [[ "$RUNNER_OS" == "Windows" ]]; then
          sdk_path="$LOCALAPPDATA/Android/Sdk"
        else
          sdk_path="$HOME/Android/Sdk"
        fi

        tool_dir="$RUNNER_TOOL_CACHE/android-cli/latest/$slug"

        binary=android
        resources="${ANDROID_USER_HOME:-$HOME/.android}/bin"
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          binary=android.exe
          sdk_path=$(cygpath -am "$sdk_path")
          tool_dir=$(cygpath -am "$tool_dir")
          resources=$(cygpath -am "${ANDROID_USER_HOME:-$USERPROFILE/.android}/bin")
        else
          mkdir -p "$sdk_path"
          sdk_path=$(cd "$sdk_path" && pwd -P)
        fi
        mkdir -p "$tool_dir" "$sdk_path"

        # Changing only workflow inputs must also invalidate the immutable SDK cache.
        if command -v sha256sum >/dev/null 2>&1; then
          config_hash=$(printf '%s\0' "$PACKAGES" "$sdk_path" "$INSTALL_URL_BASE" | sha256sum | cut -d ' ' -f 1)
        else
          config_hash=$(printf '%s\0' "$PACKAGES" "$sdk_path" "$INSTALL_URL_BASE" | shasum -a 256 | cut -d ' ' -f 1)
        fi

        {
          echo "slug=$slug"
          echo "sdk-path=$sdk_path"
          echo "tool-dir=$tool_dir"
          echo "binary=$binary"
          echo "resources=$resources"
          echo "config-hash=$config_hash"
        } >> "$GITHUB_OUTPUT"

    - name: Cache Android CLI and SDK
      if: inputs.cache == 'true'
      id: cache
      uses: actions/cache@v6
      with:
        path: |
          ${{ steps.platform.outputs.resources }}
          ${{ steps.platform.outputs.sdk-path }}
        key: setup-android-cli-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.platform.outputs.slug }}-${{ steps.platform.outputs.config-hash }}-${{ hashFiles('**/libs.versions.toml', '**/build.gradle*', '**/settings.gradle*') }}${{ inputs.cache-key && format('-{0}', inputs.cache-key) || '' }}
        restore-keys: |
          setup-android-cli-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.platform.outputs.slug }}-${{ steps.platform.outputs.config-hash }}-

    - name: Install CLI launcher
      shell: bash
      env:
        SLUG: ${{ steps.platform.outputs.slug }}
        TOOL_DIR: ${{ steps.platform.outputs.tool-dir }}
        BINARY: ${{ steps.platform.outputs.binary }}
        NO_METRICS: ${{ inputs.no-metrics }}
        INSTALL_URL_BASE: ${{ inputs.install-url-base }}
      run: |
        set -euo pipefail

        # Refresh latest on persistent runners too; never reuse an unversioned launcher.
        echo "::group::Downloading android CLI ($SLUG)"
        url="${INSTALL_URL_BASE%/}/${SLUG}/${BINARY}"
        temp_launcher=$(mktemp "$TOOL_DIR/android-download.XXXXXX")
        trap 'rm -f "$temp_launcher"' EXIT
        curl -fsSL --retry 3 --retry-delay 2 "$url" -o "$temp_launcher"
        chmod +x "$temp_launcher"
        mv -f "$temp_launcher" "$TOOL_DIR/$BINARY"
        echo "::endgroup::"

        echo "$TOOL_DIR" >> "$GITHUB_PATH"
        shell_tool_dir="$TOOL_DIR"
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          shell_tool_dir=$(cygpath -u "$TOOL_DIR")
        fi
        export PATH="$shell_tool_dir:$PATH"

        cli_args=(--version)
        if [[ "$NO_METRICS" == "true" ]]; then
          cli_args=(--no-metrics "${cli_args[@]}")
        fi
        echo "::group::Bootstrapping CLI"
        ANDROID_CLI_FRESH_INSTALL=1 android "${cli_args[@]}"
        echo "::endgroup::"

    - name: Configure ANDROID_HOME and ANDROID_SDK_ROOT
      shell: bash
      env:
        SDK_PATH: ${{ steps.platform.outputs.sdk-path }}
      run: |
        set -euo pipefail
        echo "ANDROID_HOME=$SDK_PATH" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$SDK_PATH" >> "$GITHUB_ENV"
        # Also export common adjacent PATH entries so later steps can call
        # adb / emulator without setting PATH themselves. These are only
        # populated once their packages are installed.
        {
          echo "$SDK_PATH/platform-tools"
          echo "$SDK_PATH/emulator"
          echo "$SDK_PATH/cmdline-tools/latest/bin"
        } >> "$GITHUB_PATH"

    - name: Install SDK packages
      if: inputs.packages != ''
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        SDK_PATH: ${{ steps.platform.outputs.sdk-path }}
        NO_METRICS: ${{ inputs.no-metrics }}
      run: |
        set -euo pipefail

        read -r -a package_args <<< "$(printf '%s' "$PACKAGES" | tr '\r\n' '  ')"
        cli_args=(--sdk="$SDK_PATH" sdk install "${package_args[@]}")
        if [[ "$NO_METRICS" == "true" ]]; then
          cli_args=(--no-metrics "${cli_args[@]}")
        fi
        echo "::group::Installing SDK packages"
        android "${cli_args[@]}"
        echo "::endgroup::"

    - name: Register Android/Gradle problem matchers
      shell: bash
      run: |
        set -euo pipefail
        echo "::add-matcher::${GITHUB_ACTION_PATH}/matchers.json"

    - name: Summary
      id: summary
      shell: bash
      env:
        SDK_PATH: ${{ steps.platform.outputs.sdk-path }}
        SLUG: ${{ steps.platform.outputs.slug }}
        PACKAGES: ${{ inputs.packages }}
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        NO_METRICS: ${{ inputs.no-metrics }}
      run: |
        set -euo pipefail

        cli_args=(--version)
        if [[ "$NO_METRICS" == "true" ]]; then
          cli_args=(--no-metrics "${cli_args[@]}")
        fi
        cli_version=$(android "${cli_args[@]}")
        cli_version=$(printf '%s' "$cli_version" | tr -d '\r')

        {
          echo "sdk-path=$SDK_PATH"
          echo "cli-version=$cli_version"
        } >> "$GITHUB_OUTPUT"

        {
          echo "### 🤖 Setup Android CLI"
          echo ""
          echo "| | |"
          echo "|---|---|"
          echo "| CLI version | \`$cli_version\` |"
          echo "| Platform    | \`$SLUG\` |"
          echo "| SDK path    | \`$SDK_PATH\` |"
          if [[ -n "$PACKAGES" ]]; then
            pkgs_md=$(echo "$PACKAGES" | tr '\n' ' ' | sed 's/  */ /g' | sed 's/ $//')
            echo "| Packages    | \`$pkgs_md\` |"
          fi
          if [[ -n "$CACHE_HIT" ]]; then
            echo "| Cache hit   | \`$CACHE_HIT\` |"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
